name: Build KPM Module

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取源代码
        uses: actions/checkout@v4

      - name: 配置 Android NDK 环境
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: 准备完整的 GKI 5.10 内核头文件 (解决 kprobes.h 缺失)
        run: |
          # 1. 从 Google 官方极速克隆 Android 12 (5.10) GKI 核心源码 (仅拉取最新层)
          git clone --depth 1 -b android12-5.10 https://android.googlesource.com/kernel/common.git $GITHUB_WORKSPACE/gki_src
          cd $GITHUB_WORKSPACE/gki_src
          
          # 2. 安装 Ubuntu 端的交叉编译依赖，用于生成内核配置宏
          sudo apt-get update && sudo apt-get install -y flex bison gcc-aarch64-linux-gnu
          
          # 3. 跑一遍内核初始化，生成 autoconf.h 和必要的底层头文件
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare

      - name: 编译 KPM (注入标准内核头文件)
        run: |
          export NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}
          KSRC=$GITHUB_WORKSPACE/gki_src
          
          # 4. 构造完整无缺的 Linux 头文件包含路径 (-I)
          HEADERS="-I$KSRC/include -I$KSRC/arch/arm64/include -I$KSRC/include/generated/uapi -I$KSRC/arch/arm64/include/generated/uapi -I$KSRC/include/uapi -I$KSRC/arch/arm64/include/generated"
          
          # 5. 暴力注入：将头文件路径直接插入到 Makefile 的第一行，确保编译器绝对能找到
          sed -i "1i CFLAGS += $HEADERS" Makefile
          
          # 6. 执行最终编译
          make NDK_PATH=$NDK_PATH

      - name: 打包并上传成品
        uses: actions/upload-artifact@v4
        with:
          name: KPM-Output
          path: |
            ./*.kpm
            out/*.kpm
            build/*.kpm

